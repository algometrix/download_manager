name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the minimum supported version (rust-version in Cargo.toml),
      # so a new compiler's lints cannot fail a build that did not change.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  extension:
    name: Firefox add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test extension/common/capture-rules.test.js
