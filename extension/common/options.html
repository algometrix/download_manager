<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downpour options</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        padding: 40px 24px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }
      .brand-name {
        font-size: 22px;
      }
      .options-form {
        display: grid;
        gap: 14px;
      }
      .options-form .card {
        display: grid;
        gap: 18px;
      }
      .group-title {
        font-size: 15px;
        font-weight: 700;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      .hint {
        font-weight: 400;
        font-size: 12px;
        color: var(--ink-faint);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      #saved {
        color: var(--coral);
        font-weight: 600;
      }
      #failed {
        color: var(--sun);
        font-weight: 600;
      }
      #size {
        max-width: 160px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon-48.png" alt="" />
        <div>
          <h1 class="brand-name">Downpour options</h1>
          <div class="brand-tagline">Choose which browser downloads Downpour takes over.</div>
        </div>
      </div>

      <form id="options" class="options-form">
        <section class="card">
          <h2 class="group-title">Behavior</h2>
          <label class="switch">
            <span>Capture browser downloads</span>
            <input id="capture" type="checkbox" />
          </label>
          <label class="switch">
            <span>Show a Download button on videos</span>
            <input id="video-button" type="checkbox" />
          </label>
          <label class="switch">
            <span>
              Show a notice when Downpour takes a download<br />
              <span class="hint">A short message in the page's lower right corner. The toolbar icon shows a check mark either way.</span>
            </span>
            <input id="handoff-notice" type="checkbox" />
          </label>
        </section>
        <section class="card">
          <h2 class="group-title">What to capture</h2>
          <label>
            File types to capture
            <span class="hint">Extensions separated by spaces or commas.</span>
            <textarea id="types" class="field"></textarea>
          </label>
          <label>
            Minimum size (KB)
            <span class="hint">Smaller downloads stay in the browser. 0 captures every size.</span>
            <input id="size" class="field" type="number" min="0" step="1" />
          </label>
          <label>
            Never capture from these sites
            <span class="hint">One per line. <code>example.com</code> includes its subdomains; <code>*.example.com</code> only subdomains.</span>
            <textarea id="excluded" class="field"></textarea>
          </label>
        </section>
        <div class="actions">
          <button class="button primary" type="submit">Save</button>
          <button id="reset" class="button" type="button">Restore defaults</button>
          <span id="saved" hidden>Saved.</span>
          <span id="failed" role="alert" hidden></span>
        </div>
      </form>
    </main>
    <script src="capture-rules.js"></script>
    <script src="options.js"></script>
  </body>
</html>
