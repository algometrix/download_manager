[package]
name = "downpour-cli"
description = "Command-line downloader for Downpour: download in the terminal, or hand links to the running app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "downpour-cli"
path = "src/main.rs"

[dependencies]
downpour-core.workspace = true
downpour-protocol.workspace = true
clap = { version = "4.5", features = ["derive"] }
getrandom.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[build-dependencies]
downpour-build.workspace = true
