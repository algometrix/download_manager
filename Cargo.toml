[workspace]
resolver = "3"
members = ["crates/downpour-build", "crates/downpour-core", "crates/downpour-protocol", "crates/downpour-host", "crates/downpour-app", "crates/downpour-cli", "crates/downpour-setup"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
downpour-core = { path = "crates/downpour-core" }
downpour-protocol = { path = "crates/downpour-protocol" }
downpour-build = { path = "crates/downpour-build" }
aes = "0.8"
cbc = "0.1"
directories = "6"
fs4 = "0.13"
futures-util = "0.3"
getrandom = { version = "0.3", features = ["std"] }
percent-encoding = "2"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
winreg = "0.55"
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
